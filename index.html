<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بنك الدم</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #8B0000;
      color: white;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    h1 {
      margin-top: 30px;
      font-size: 40px;
    }

    .buttons {
      margin: 50px auto;
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .buttons button {
      background-color: white;
      color: #8B0000;
      border: none;
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .buttons button:hover {
      background-color: #f2cccc;
    }

    .login, .signup {
      margin-top: 20px;
      font-size: 20px;
    }

    .blood-cell {
      position: absolute;
      width: 30px;
      height: 30px;
      background-color: red;
      border-radius: 50%;
      opacity: 0.6;
      animation: float 10s infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) translateX(0);
      }
      100% {
        transform: translateY(-100vh) translateX(50px);
      }
    }
  </style>
</head>
<body>

  <h1>Welcome</h1>

  <div class="buttons">
    <button>تبرع بالدم</button>
    <button>تسجيل طلب دم</button>
  </div>

  <div class="login">تسجيل دخول</div>
  <div class="signup">إنشاء حساب جديد</div>

  <!-- كرات دم حمراء متحركة -->
  <script>
    for (let i = 0; i < 30; i++) {
      const cell = document.createElement('div');
      cell.className = 'blood-cell';
      cell.style.left = Math.random() * 100 + 'vw';
      cell.style.animationDuration = (6 + Math.random() * 5) + 's';
      cell.style.width = cell.style.height = (20 + Math.random() * 20) + 'px';
      document.body.appendChild(cell);
    }
  </script>

</body>
  </html>
